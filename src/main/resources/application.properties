spring.application.name=TouristSafety
server.port=8080



# Day 1: point this at a local MySQL instance, or swap for a cloud MySQL
# URL (PlanetScale/Railway/RDS) when you deploy on Day 7.
spring.datasource.url=jdbc:mysql://localhost:3306/tourist
spring.datasource.username=root
spring.datasource.password=Deva@#2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# fine for a solo/demo project; switch to migrations (Flyway) if you productionize
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Day 2: replace with an env var (JWT_SECRET) before deploying -- never commit real secrets.
app.jwt.secret=CHANGE_ME_dev_only_secret_key_please_replace_before_day2
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

# ─── Gmail SMTP (Email Alerts) ────────────────────────────────────────────────
# Set MAIL_USERNAME and MAIL_PASSWORD env vars (use a Gmail App Password, NOT your account password).
# Steps: Google Account → Security → 2-Step Verification → App Passwords → Generate.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Admin email to receive CRITICAL alert summaries
app.alert.admin-email=${ADMIN_EMAIL:admin@touristsafety.local}
